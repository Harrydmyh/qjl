<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>自动开团 · 汤团</title>
<style>
  :root {
    --bg: #f6f8f7; --card: #ffffff; --line: #e2e8e4; --ink: #192620; --dim: #64746b;
    --green: #1f6f4a; --green-light: #e8f5ee; --green-border: #9dd8bb;
    --red: #c0392b; --red-light: #fbeeed;
    --amber: #b7791f; --amber-light: #fef5e7;
    --blue: #2b6cb0; --blue-light: #edf4fc;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 13.5px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .wrap { max-width: 980px; margin: 0 auto; padding: 14px 16px 40px; }
  a { color: var(--green); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* Top Navigation & Status Bar */
  .top-bar {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 10px; margin-bottom: 12px;
  }
  .top-left { display: flex; align-items: center; gap: 10px; }
  h1 { font-size: 18px; font-weight: 700; margin: 0; display: flex; align-items: center; gap: 8px; }
  .status-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 500;
    background: #e9ecea; color: var(--dim);
  }
  .status-badge.running { background: var(--green-light); color: var(--green); border: 1px solid var(--green-border); }
  .status-badge.stopped { background: #f0f2f1; color: var(--dim); border: 1px solid var(--line); }
  .status-badge.error { background: var(--red-light); color: var(--red); border: 1px solid #f1c5c0; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #999; }
  .dot.on { background: #28a745; box-shadow: 0 0 0 3px rgba(40,167,69,.2); }
  .dot.busy { background: #28a745; animation: pulse 1.2s infinite; }
  .dot.off { background: #a0aba5; }
  .dot.err { background: var(--red); box-shadow: 0 0 0 3px rgba(192,57,43,.2); }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(40,167,69,.6); }
    70% { box-shadow: 0 0 0 8px rgba(40,167,69,0); }
    100% { box-shadow: 0 0 0 0 rgba(40,167,69,0); }
  }

  .actions { display: flex; align-items: center; gap: 8px; }
  button {
    font-family: inherit; font-size: 13px; font-weight: 500;
    padding: 6px 14px; border-radius: 7px; border: 1px solid var(--line);
    background: #fff; color: var(--ink); cursor: pointer; transition: all .15s;
    display: inline-flex; align-items: center; gap: 5px;
  }
  button:hover { border-color: #bdc8c1; background: #fafbfc; }
  button.primary { background: var(--green); border-color: var(--green); color: #fff; }
  button.primary:hover { background: #185a3c; }
  button.danger { background: #fff; border-color: #f1c5c0; color: var(--red); }
  button.danger:hover { background: var(--red-light); }
  button.secondary { background: #f0f5f2; border-color: var(--green-border); color: var(--green); }
  button.secondary:hover { background: var(--green-light); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .btn-link { font-size: 12.5px; color: var(--dim); padding: 5px 8px; border: none; background: transparent; }
  .btn-link:hover { color: var(--ink); background: transparent; }

  /* Compact Hero / Next schedule strip */
  .hero-strip {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 10px 14px; margin-bottom: 12px; display: flex; align-items: center;
    justify-content: space-between; flex-wrap: wrap; gap: 10px;
  }
  .hero-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .next-pill {
    background: #f0f5f2; border: 1px solid var(--green-border); border-radius: 6px;
    padding: 4px 10px; text-align: center; flex: 0 0 auto;
  }
  .next-pill .time { font-size: 16px; font-weight: 700; color: var(--green); line-height: 1.1; font-family: ui-monospace, Menlo, monospace; }
  .next-pill .lbl { font-size: 10.5px; color: var(--dim); }
  .hero-info { min-width: 0; }
  .hero-title { font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hero-meta { font-size: 11.5px; color: var(--dim); }
  .hero-right { text-align: right; flex: 0 0 auto; }
  .pace-badge { font-size: 12px; color: var(--dim); background: #f2f5f3; padding: 3px 8px; border-radius: 5px; }

  /* Stat Grid */
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 12px; }
  .stat-card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 10px 12px;
  }
  .stat-card .num { font-size: 20px; font-weight: 700; line-height: 1.2; color: var(--ink); font-family: ui-monospace, Menlo, monospace; }
  .stat-card .lbl { font-size: 12px; color: var(--dim); margin-top: 2px; }
  .stat-card .sub { font-size: 11px; color: #8a9991; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Main Cards */
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 12px 14px; margin-bottom: 12px;
  }
  .card-hdr {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px; flex-wrap: wrap; gap: 8px;
  }
  .card-title { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .card-sub { font-size: 12px; color: var(--dim); font-weight: 400; }

  /* Generator Console Box */
  .gen-box {
    display: none; background: #15201b; color: #cdd9d2; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 11.5px; border-radius: 7px; padding: 10px 12px; margin-bottom: 10px; line-height: 1.5;
  }
  .gen-status { font-weight: 600; color: #5cd697; margin-bottom: 6px; display: flex; align-items: center; justify-content: space-between; }
  .gen-logs { max-height: 140px; overflow-y: auto; color: #a4b5ac; }
  .gen-logs div { white-space: pre-wrap; word-break: break-all; }

  /* Date Pills */
  .days-bar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 8px; }
  .day-btn {
    flex: 0 0 auto; border: 1px solid var(--line); border-radius: 7px;
    padding: 5px 9px; cursor: pointer; background: #fafbfc; text-align: center;
    min-width: 70px; font-size: 11.5px; line-height: 1.35; transition: all .15s;
  }
  .day-btn:hover { border-color: #bdc8c1; }
  .day-btn.on { border-color: var(--green); background: var(--green-light); color: var(--green); font-weight: 600; }
  .day-btn .dd { font-weight: 600; font-size: 12px; }
  .day-btn .dn { font-size: 10.5px; color: var(--dim); }
  .day-btn.on .dn { color: var(--green); }

  /* Table */
  .tblwrap { max-height: 360px; overflow-y: auto; border: 1px solid var(--line); border-radius: 7px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid #edf1ee; vertical-align: middle; }
  th { background: #fafbfc; color: var(--dim); font-weight: 600; position: sticky; top: 0; z-index: 2; }
  td.t { white-space: nowrap; color: var(--dim); font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; }
  td.nm { max-width: 320px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  tr:hover { background: #fbfdfc; }

  /* Badges */
  .tag { display: inline-block; padding: 1px 6px; border-radius: 12px; font-size: 11px; white-space: nowrap; }
  .tag.open { background: var(--green-light); color: var(--green); }
  .tag.pending { background: #eef2f0; color: var(--dim); }
  .tag.skip { background: var(--amber-light); color: var(--amber); }
  .tag.fail { background: var(--red-light); color: var(--red); }
  .tag.config { background: var(--blue-light); color: var(--blue); }
  .tag.idle { background: #f0f2f1; color: var(--dim); }

  /* Reports List & Download */
  .report-list { display: flex; flex-direction: column; gap: 8px; }
  .report-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: #fafbfc;
    flex-wrap: wrap; gap: 8px;
  }
  .report-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .report-icon { font-size: 18px; line-height: 1; flex: 0 0 auto; }
  .report-name { font-weight: 600; font-size: 13px; color: var(--ink); word-break: break-all; }
  .report-sub { font-size: 11px; color: var(--dim); margin-top: 1px; }
  .btn-dl {
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--green-light); color: var(--green); border: 1px solid var(--green-border);
    padding: 5px 12px; border-radius: 6px; font-size: 12px; font-weight: 600; text-decoration: none;
    transition: all .15s; flex: 0 0 auto;
  }
  .btn-dl:hover { background: #d7ecdf; text-decoration: none; }

  /* Bottom 2-Column Section */
  .bottom-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  .field { display: flex; flex-direction: column; gap: 3px; }
  .field.full { grid-column: span 2; }
  .field label { font-size: 11px; color: var(--dim); font-weight: 500; }
  input {
    width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px;
    font: 12.5px/1.3 ui-monospace, Menlo, monospace; background: #fafbfc; color: var(--ink);
  }
  input:focus { outline: none; border-color: var(--green); background: #fff; }
  .token-status { font-size: 11.5px; color: var(--dim); display: flex; align-items: center; gap: 6px; }
  .msg { font-size: 12px; padding: 6px 10px; border-radius: 6px; display: none; margin-top: 8px; }
  .msg.ok { display: block; background: var(--green-light); color: var(--green); }
  .msg.err { display: block; background: var(--red-light); color: var(--red); }

  .empty { color: var(--dim); text-align: center; padding: 18px 0; font-size: 12px; }
  #toast {
    position: fixed; left: 50%; top: 16px; transform: translateX(-50%); z-index: 99;
    background: #192620; color: #fff; font-size: 13px; padding: 8px 16px; border-radius: 6px;
    opacity: 0; pointer-events: none; transition: opacity .2s; box-shadow: 0 4px 12px rgba(0,0,0,.15);
  }
  #toast.show { opacity: 1; }

  /* Hidden hook elements for script compatibility */
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }

  @media(max-width: 720px) {
    .grid { grid-template-columns: 1fr 1fr; }
    .bottom-grid { grid-template-columns: 1fr; }
    .hero-strip { flex-direction: column; align-items: flex-start; }
    .hero-right { text-align: left; }
    td.nm { max-width: 160px; }
    .report-item { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>
<div id="toast"></div>

<div class="wrap">
  <!-- Top Navigation & Global Controls -->
  <div class="top-bar">
    <div class="top-left">
      <h1>
        自动开团 · 汤团
        <span class="status-badge" id="statusBadge">
          <span class="dot off" id="dot"></span>
          <span id="stateText">读取中…</span>
        </span>
      </h1>
      <span class="card-sub" id="stateHint" style="margin-left: 2px;"></span>
    </div>
    <div class="actions">
      <a href="/" class="btn-link">← 主开团页</a>
      <button id="btnRun">马上开一条</button>
      <button class="primary" id="btnToggle">启动</button>
    </div>
  </div>

  <!-- Hidden hooks for script compatibility -->
  <div class="sr-only">
    <span id="step1Badge"></span>
    <span id="step1Desc"></span>
    <span id="step2Desc"></span>
  </div>

  <!-- Hero Next Schedule Ribbon -->
  <div class="hero-strip">
    <div class="hero-left">
      <div class="next-pill">
        <div class="time" id="nextTime">--:--</div>
        <div class="lbl">下一条</div>
      </div>
      <div class="hero-info">
        <div class="hero-title" id="nextName">—</div>
        <div class="hero-meta" id="nextMeta">暂无安排</div>
        <div id="overdueHint" style="font-size: 11px; color: var(--amber); margin-top: 2px;"></div>
      </div>
    </div>
    <div class="hero-right">
      <span class="pace-badge" id="paceText">—</span>
    </div>
  </div>

  <!-- 4 Core Metrics -->
  <div class="grid">
    <div class="stat-card">
      <div class="num" id="sToday">-</div>
      <div class="lbl">今天要开</div>
      <div class="sub" id="sTodayX"></div>
    </div>
    <div class="stat-card">
      <div class="num" id="sDone">-</div>
      <div class="lbl">今天已开</div>
      <div class="sub" id="sDoneX"></div>
    </div>
    <div class="stat-card">
      <div class="num" id="sWeek">-</div>
      <div class="lbl">本周待开</div>
      <div class="sub" id="sWeekX"></div>
    </div>
    <div class="stat-card">
      <div class="num" id="sAll">-</div>
      <div class="lbl">清单总数</div>
      <div class="sub" id="sAllX"></div>
    </div>
  </div>

  <!-- Schedule List (7 Days) -->
  <div class="card">
    <div class="card-hdr">
      <div class="card-title">
        开团清单
        <span class="card-sub" id="planMeta"></span>
      </div>
      <div class="actions">
        <button id="btnGenerate" class="secondary" style="font-size: 12px; padding: 4px 10px;">
          ⚡ 重新生成周报与清单
        </button>
      </div>
    </div>

    <!-- Generator Console Drawer -->
    <div class="gen-box" id="genConsole">
      <div class="gen-status">
        <span id="genStatusText">正在执行 weekly800.py...</span>
        <button id="btnCloseGen" class="btn-link" style="color:#a4b5ac; padding:0; font-size:11px;">收起</button>
      </div>
      <div class="gen-logs" id="genLogs"></div>
    </div>

    <div class="days-bar" id="days"></div>
    <div id="planBox"><div class="empty">读取排期中…</div></div>
  </div>

  <!-- Reports & Download Section (Supports Mobile & PC) -->
  <div class="card">
    <div class="card-hdr">
      <div class="card-title">
        周报表格与下载
        <span class="card-sub">含「跟团」与「帮卖」两份完整清单（已带活动ID）</span>
      </div>
      <div class="actions">
        <button id="btnRefreshReports" class="btn-link" style="font-size: 12px;">刷新列表</button>
      </div>
    </div>
    <div id="reportsList"><div class="empty">加载表格列表中…</div></div>
    <div style="font-size: 11px; color: var(--dim); margin-top: 8px; line-height: 1.5;">
      📱 <b>手机端下载提示</b>：点击直接下载表格。iOS 端可保存至「文件」App 或用 Numbers / WPS 打开；微信内点击后选择右上角「用其他应用打开」；安卓浏览器下载后即可调用 WPS / Office 查看。
    </div>
  </div>

  <!-- Bottom Section: Account Settings & Live Events -->
  <div class="bottom-grid">
    <!-- Account Settings -->
    <div class="card">
      <div class="card-hdr">
        <div class="card-title">开团账号</div>
        <span class="card-sub" id="acctSrc"></span>
      </div>
      <div class="input-grid">
        <div class="field">
          <label>账号备注</label>
          <input id="fName" placeholder="汤团（定时复团）">
        </div>
        <div class="field">
          <label>ghId</label>
          <input id="fGh" placeholder="PspU4o9_bsxkBH0_6c6cef00">
        </div>
        <div class="field">
          <label>UID (可空)</label>
          <input id="fUid" placeholder="164779047">
        </div>
        <div class="field">
          <label>Auth Token (换号/续期时粘贴)</label>
          <input id="fToken" type="password" placeholder="留空 = 保持现有">
        </div>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;">
        <span class="token-status" id="tokenInfo">检测中…</span>
        <button class="primary" id="btnSave" style="padding: 5px 12px; font-size: 12.5px;">保存账号</button>
      </div>
      <div class="msg" id="acctMsg"></div>
    </div>

    <!-- Live Event Log -->
    <div class="card">
      <div class="card-hdr">
        <div class="card-title">最近动作</div>
        <span class="card-sub" id="tickInfo"></span>
      </div>
      <div id="evBox"><div class="empty">暂无动作记录</div></div>
    </div>
  </div>
</div>

<script>
const ACCESS_KEY = (function(){
  const q = new URLSearchParams(location.search);
  const fromUrl = (q.get('k') || '').trim();
  if (fromUrl) { try { localStorage.setItem('qjl_key', fromUrl); } catch(e){} return fromUrl; }
  try { return localStorage.getItem('qjl_key') || ''; } catch(e){ return ''; }
})();

async function api(path, opt){
  opt = opt || {};
  opt.headers = Object.assign({'X-Access-Key': ACCESS_KEY, 'Content-Type':'application/json'}, opt.headers || {});
  const r = await fetch(path, opt);
  if (r.status === 401) throw new Error('需要访问密钥：地址后加 ?k=你的密钥');
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

const $ = id => document.getElementById(id);
let enabled = false;
let today = '';
let selDate = '';
let dayCache = {};

const KIND = {open:'已开团', fail:'失败', skip:'跳过', config:'配置', idle:'空跑', error:'异常'};
const STATUS = {pending:['待开','pending'], opened:['已开','open'], skip_recent:['跳过','skip'], failed:['失败','fail']};

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
let toastTimer = null;
function showToast(msg){
  const el = $('toast');
  el.textContent = msg;
  el.className = 'show';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = ''; }, 3200);
}
function fmtTime(iso){
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  const p = n => String(n).padStart(2,'0');
  return `${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
function minsText(m){
  if (m == null) return '';
  if (m > 60) return `约 ${Math.round(m/60*10)/10} 小时后`;
  if (m > 0) return `还有 ${m} 分钟`;
  if (m === 0) return '就是现在';
  return `已过 ${-m} 分钟`;
}

function render(s){
  enabled = !!s.enabled;
  const p = s.plan || {};
  const _d = new Date(), _p = n => String(n).padStart(2,'0');
  const localToday = `${_d.getFullYear()}-${_p(_d.getMonth()+1)}-${_p(_d.getDate())}`;
  today = p.today || localToday;

  // 状态显示
  const cur = s.current;
  const badge = $('statusBadge');
  if (s.account && s.account.error) {
    $('dot').className = 'dot err';
    badge.className = 'status-badge error';
    $('stateText').textContent = '账号异常';
    $('stateHint').textContent = s.account.error;
  } else if (cur) {
    const sec = Math.max(0, Math.round((new Date(s.serverTime || Date.now()) - new Date(cur.startedAt)) / 1000));
    $('dot').className = 'dot on busy';
    badge.className = 'status-badge running';
    $('stateText').textContent = '正在开团…';
    $('stateHint').textContent = `${cur.name || ''} (${cur.supplier || ''}) · ${sec}s`;
  } else if (s.enabled) {
    $('dot').className = 'dot on';
    badge.className = 'status-badge running';
    $('stateText').textContent = '运行中';
    const bits = [];
    if (s.lastRunAt) bits.push('上次 ' + fmtTime(s.lastRunAt));
    $('stateHint').textContent = bits.join(' · ');
  } else {
    $('dot').className = 'dot off';
    badge.className = 'status-badge stopped';
    $('stateText').textContent = '已停止';
    const bits = [];
    if (s.stopFile) bits.push('STOP文件');
    if (!s.threadAlive) bits.push('调度未启动');
    $('stateHint').textContent = bits.join(' · ');
  }
  $('btnToggle').textContent = s.enabled ? '停止' : '启动';
  $('btnToggle').className = s.enabled ? 'danger' : 'primary';

  // 统计
  $('sToday').textContent = p.ok ? p.todayTotal : '-';
  $('sTodayX').textContent = p.ok ? `待开 ${p.todayPending}${p.overdue ? ` · 过点 ${p.overdue}` : ''}` : '';
  $('sDone').textContent = p.ok ? (p.todayDone || 0) : '-';
  $('sDoneX').textContent = p.ok ? `累计已开 ${p.opened}` : '';
  const weekPend = p.ok ? (p.days || []).reduce((a,d)=>a+d.pending,0) : 0;
  $('sWeek').textContent = p.ok ? weekPend : '-';
  $('sWeekX').textContent = p.ok ? '未来7天' : '';
  $('sAll').textContent = p.ok ? p.total : '-';
  $('sAllX').textContent = p.ok ? `跳过 ${p.skipped}${p.failed ? ` · 失败 ${p.failed}` : ''}` : '';

  // 节奏 & 下一条
  $('paceText').textContent = p.ok ? (p.pace || '正常节奏') : '—';
  if (p.ok && p.next) {
    const n = p.next;
    const isToday = n.date === today;
    $('nextTime').innerHTML = esc(n.time || '--:--');
    $('nextName').textContent = n.name || '';
    $('nextMeta').textContent = [
      isToday ? minsText(n.inMinutes) : (n.date.slice(5) + ' ' + (n.time||'')),
      n.supplier, n.cat, n.orders ? (n.orders + '单') : ''
    ].filter(Boolean).join(' · ');
  } else {
    $('nextTime').innerHTML = '--:--';
    $('nextName').textContent = p.ok ? '当前期清单已全部完成' : '暂无清单计划（可点击右上角生成）';
    $('nextMeta').textContent = '等待生成';
  }
  $('overdueHint').textContent = (p.ok && p.overdue)
    ? `⚠️ 发现 ${p.overdue} 条已过点待开，启动后将按限速每 ${p.gapToday || 15} 分钟安全补开`
    : '';

  // 日期排期条
  if (p.ok) {
    if (!selDate || selDate < today) selDate = today;
    $('days').innerHTML = (p.days || []).map(d => `
      <div class="day-btn ${d.date === selDate ? 'on' : ''}" data-d="${d.date}">
        <div class="dw">${d.weekday}${d.isToday ? ' (今)' : ''}</div>
        <div class="dd">${d.date.slice(5)}</div>
        <div class="dn">${d.pending ? d.pending + ' 待开' : (d.total ? '已开完' : '无')}</div>
      </div>`).join('');
    $('days').querySelectorAll('.day-btn').forEach(el => {
      el.onclick = () => {
        selDate = el.dataset.d;
        delete dayCache[selDate];
        renderDaysOnly(p);
        renderPlan(p);
      };
    });
    $('planMeta').textContent = p.planMtime ? ('更新于 ' + fmtTime(p.planMtime)) : '';
    dayCache[today] = p.items || [];
    renderPlan(p);
  } else {
    $('days').innerHTML = '';
    $('planBox').innerHTML = `<div class="empty">
      ${esc(p.msg || '还没有开团清单')}<br><br>
      <button onclick="startGenerate()" class="primary" style="font-size:12px; margin:0 auto;">⚡ 立即生成周报清单</button>
    </div>`;
    $('planMeta').textContent = '';
  }

  // 账号卡片
  const a = s.account || {};
  if (a.error) {
    $('tokenInfo').textContent = a.error;
    $('tokenInfo').style.color = 'var(--red)';
  } else {
    const ti = a.tokenInfo || {};
    $('tokenInfo').textContent = [
      ti.valid ? ('✓ Token 有效至 ' + (ti.exp_str || '')) : ('✗ Token 已失效 ' + (ti.exp_str || '')),
      a.tokenPreview || ''
    ].filter(Boolean).join(' · ');
    $('tokenInfo').style.color = ti.valid ? 'var(--green)' : 'var(--red)';
    $('acctSrc').textContent = (a.source || '') + (a.ghId ? ' (' + a.ghId + ')' : '');
    if (document.activeElement !== $('fName'))  $('fName').value  = a.name  || '';
    if (document.activeElement !== $('fGh'))    $('fGh').value    = a.ghId  || '';
    if (document.activeElement !== $('fUid'))   $('fUid').value   = a.uid   || '';
  }

  // 动作日志
  $('tickInfo').textContent = s.serverTime ? ('巡检间隔: ' + s.tickSeconds + 's') : '';
  const ev = s.events || [];
  if (!ev.length) {
    $('evBox').innerHTML = '<div class="empty">暂无动作记录</div>';
  } else {
    const rows = ev.slice(0, 20).map(e => `
      <tr>
        <td class="t">${fmtTime(e.at)}</td>
        <td><span class="tag ${e.kind}">${KIND[e.kind] || e.kind}</span></td>
        <td style="word-break:break-all;">${esc(e.text)}</td>
      </tr>`).join('');
    $('evBox').innerHTML = `<div class="tblwrap"><table><thead><tr><th style="width:85px">时间</th><th style="width:60px">类型</th><th>内容</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  }
}

function renderDaysOnly(p){
  $('days').querySelectorAll('.day-btn').forEach(el => {
    el.className = 'day-btn' + (el.dataset.d === selDate ? ' on' : '');
  });
}

async function renderPlan(p){
  const d = selDate || today;
  let items = dayCache[d];
  if (!items) {
    $('planBox').innerHTML = '<div class="empty">加载中…</div>';
    try {
      const r = await api('/api/auto/day?date=' + encodeURIComponent(d));
      items = r.items || [];
      dayCache[d] = items;
    } catch(e) {
      $('planBox').innerHTML = `<div class="empty">读不到清单：${esc(e.message)}</div>`;
      return;
    }
  }
  if (!items.length) {
    $('planBox').innerHTML = '<div class="empty">该日期暂无开团排期</div>';
    $('planBox').dataset.sig = d + '|empty';
    return;
  }
  const sig = d + '|' + items.map(x => (x.actId || '') + ':' + x.status).join(',');
  if ($('planBox').dataset.sig === sig) return;
  $('planBox').dataset.sig = sig;

  const rows = items.map(x => {
    const st = STATUS[x.status] || [x.status || '', 'pending'];
    return `<tr>
      <td class="t">${esc(x.time || '')}</td>
      <td style="color:var(--dim);">${esc(x.cat || '')}</td>
      <td class="nm" title="${esc(x.name || '')}">${esc(x.name || '')}</td>
      <td style="color:var(--dim);">${esc(x.supplier || '')}</td>
      <td>
        <span class="tag ${st[1]}">${st[0]}</span>
        ${x.note ? `<div style="font-size:11px;color:var(--dim);margin-top:2px;max-width:160px;line-height:1.2;word-break:break-all;" title="${esc(x.note)}">${esc(x.note)}</div>` : ''}
      </td>
      <td class="t">${x.orders || ''}</td>
    </tr>`;
  }).join('');

  const oldWrap = $('planBox').querySelector('.tblwrap');
  const keepTop = oldWrap ? oldWrap.scrollTop : 0;
  $('planBox').innerHTML = `<div class="tblwrap"><table>
    <thead><tr><th style="width:55px">时间</th><th style="width:70px">品类</th><th>商品名称</th>
    <th style="width:120px">供货商</th><th style="width:110px">状态</th><th style="width:55px">订单</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
  const newWrap = $('planBox').querySelector('.tblwrap');
  if (newWrap) newWrap.scrollTop = keepTop;
}

let busy = false;
async function refresh(){
  if (busy) return;
  let s;
  try {
    s = await api('/api/auto/status');
  } catch(e) {
    $('dot').className = 'dot err';
    $('statusBadge').className = 'status-badge error';
    $('stateText').textContent = '离线';
    $('stateHint').textContent = e.message;
    return;
  }
  render(s);
  checkGenStatus();
}

// ── Reports & Download List ──
async function loadReports(){
  try {
    const r = await api('/api/auto/reports');
    const files = r.files || [];
    if (!files.length) {
      $('reportsList').innerHTML = '<div class="empty">周报目录下暂无 Excel 表格</div>';
      return;
    }
    const html = files.map(f => {
      const dlUrl = `/api/auto/download?file=${encodeURIComponent(f.name)}&k=${encodeURIComponent(ACCESS_KEY)}`;
      return `
        <div class="report-item">
          <div class="report-left">
            <span class="report-icon">📊</span>
            <div>
              <div class="report-name">${esc(f.name)}</div>
              <div class="report-sub">${esc(f.size_str)} · 修改于 ${esc(f.mtime)}</div>
            </div>
          </div>
          <a href="${dlUrl}" target="_blank" download="${esc(f.name)}" class="btn-dl">
            ⬇️ 下载表格
          </a>
        </div>`;
    }).join('');
    $('reportsList').innerHTML = `<div class="report-list">${html}</div>`;
  } catch(e) {
    $('reportsList').innerHTML = `<div class="empty">加载表格失败: ${esc(e.message)}</div>`;
  }
}

// ── Weekly Generator & Live Console ──
let genTimer = null;
async function checkGenStatus(){
  try {
    const r = await api('/api/auto/generate-status');
    const isRunning = r.state === 'running';
    const btn = $('btnGenerate');
    if (isRunning) {
      btn.disabled = true;
      btn.textContent = '⏳ 正在生成周报清单...';
      $('genConsole').style.display = 'block';
      $('genStatusText').textContent = '执行中：' + (r.progress || '扫描中...');
      renderGenLogs(r.logs || []);
      if (!genTimer) genTimer = setInterval(checkGenStatus, 2000);
    } else {
      btn.disabled = false;
      btn.textContent = '⚡ 重新生成周报与清单';
      if (r.state === 'done') {
        $('genStatusText').innerHTML = '✅ <span style="color:#5cd697;">' + esc(r.progress || '生成完成') + '</span> (' + fmtTime(r.finished_at) + ')';
        renderGenLogs(r.logs || []);
      } else if (r.state === 'failed') {
        $('genStatusText').innerHTML = '❌ <span style="color:var(--red);">' + esc(r.error || '生成失败') + '</span>';
        renderGenLogs(r.logs || []);
      }
      if (genTimer) {
        clearInterval(genTimer);
        genTimer = null;
        loadReports();
        refresh();
      }
    }
  } catch(e) {}
}

function renderGenLogs(logs){
  const el = $('genLogs');
  el.innerHTML = logs.map(l => `<div><span style="color:#6d8277;">[${esc(l.t)}]</span> ${esc(l.text)}</div>`).join('');
  el.scrollTop = el.scrollHeight;
}

let genForceUntil = 0;   // 二次确认：30 秒内再点一次 = 强制重跑

async function startGenerate(){
  if ($('btnGenerate').disabled) return;
  try {
    const force = Date.now() < genForceUntil;
    const r = await api('/api/auto/generate', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({force})
    });
    if (!r.ok) {
      if (r.need_confirm) {
        genForceUntil = Date.now() + 30000;
        showToast(r.msg);
        return;
      }
      showToast(r.msg || '无法启动生成');
      return;
    }
    genForceUntil = 0;
    showToast('已开始在后台扫描并生成周报清单');
    $('genConsole').style.display = 'block';
    checkGenStatus();
  } catch(e) { showToast(e.message); }
}

$('btnGenerate').onclick = startGenerate;
$('btnCloseGen').onclick = () => { $('genConsole').style.display = 'none'; };
$('btnRefreshReports').onclick = () => { loadReports(); showToast('已刷新表格列表'); };

$('btnToggle').onclick = async () => {
  if (busy) return;
  busy = true;
  try {
    const r = await api('/api/auto/toggle', {method:'POST', body: JSON.stringify({enabled: !enabled})});
    await refresh();
    if (r.warn) showToast(r.warn);
    else showToast(enabled ? '已停止' : '已启动自动开团');
  } catch(e){ showToast(e.message); }
  busy = false;
};

$('btnRun').onclick = async () => {
  busy = true;
  $('btnRun').disabled = true;
  try {
    const r = await api('/api/auto/run', {method:'POST'});
    const res = r.result || {};
    await refresh();
    if (!res.acted && res.why) showToast('未执行：' + res.why);
    else showToast('已执行，详情查看右下角「最近动作」');
  } catch(e){ showToast(e.message); }
  $('btnRun').disabled = false;
  busy = false;
};

$('btnSave').onclick = async () => {
  const msg = $('acctMsg');
  msg.className = 'msg';
  const body = {
    name: $('fName').value.trim(),
    ghId: $('fGh').value.trim(),
    uid: $('fUid').value.trim(),
    authToken: $('fToken').value.trim()
  };
  if (!body.ghId && !body.authToken && !body.name) {
    msg.className = 'msg err'; msg.textContent = '请至少填写一项再保存'; return;
  }
  try {
    await api('/api/auto/account', {method:'POST', body: JSON.stringify(body)});
    $('fToken').value = '';
    msg.className = 'msg ok';
    msg.textContent = '账号配置已保存' + (body.authToken ? '（新 Token 立即生效）' : '');
    await refresh();
  } catch(e) {
    msg.className = 'msg err'; msg.textContent = e.message;
  }
};

refresh();
loadReports();
let pollTimer = null;
function schedule(){
  clearTimeout(pollTimer);
  pollTimer = setTimeout(async () => {
    await refresh();
    schedule();
  }, enabled ? 4000 : 10000);
}
refresh().then(schedule);
</script>
</body>
</html>
